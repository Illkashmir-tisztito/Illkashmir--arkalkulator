<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Illkashmir ÁrKalkulátor</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}

.box {
    max-width: 430px;
    margin: auto;
    background: white;
    padding: 24px;
    border-radius: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

h2 {
    text-align: center;
    font-size: 20px;
    margin-top: 0;
    color: #555;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

input, select, button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    font-size: 17px;
    box-sizing: border-box;
    border-radius: 9px;
}

input, select {
    border: 1px solid #ccc;
}

button {
    margin-top: 22px;
    background: #198754;
    color: white;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

#meretEredmeny {
    text-align: center;
    margin-top: 18px;
    font-size: 18px;
}

#eredmeny {
    margin-top: 18px;
    padding: 18px;
    background: #eaf7ef;
    border-radius: 12px;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #146c43;
}
</style>
</head>

<body>

<div class="box">

<h1>Illkashmir</h1>
<h2>Szőnyegtisztítás árkalkulátor</h2>

<label>Hosszúság (méter)</label>
<input type="number" id="hossz" step="0.01" placeholder="pl. 3">

<label>Szélesség (méter)</label>
<input type="number" id="szelesseg" step="0.01" placeholder="pl. 2.5">

<label>Szolgáltatás</label>
<select id="szolgaltatas">
    <option value="18">Behozva az üzembe – 18 RON/m²</option>
    <option value="20">Mi megyünk érte – 20 RON/m²</option>
</select>

<button onclick="szamol()">Ár kiszámítása</button>

<div id="meretEredmeny"></div>
<div id="eredmeny"></div>

</div>

<script>
function szamol() {
    const hossz = parseFloat(document.getElementById("hossz").value);
    const szelesseg = parseFloat(document.getElementById("szelesseg").value);
    const ar = parseFloat(document.getElementById("szolgaltatas").value);

    if (!hossz || !szelesseg || hossz <= 0 || szelesseg <= 0) {
        document.getElementById("meretEredmeny").innerHTML =
        "Add meg a szőnyeg hosszát és szélességét!";
        document.getElementById("eredmeny").innerHTML = "";
        return;
    }

    const nm = hossz * szelesseg;
    const osszeg = nm * ar;

    document.getElementById("meretEredmeny").innerHTML =
        "Méret: " + nm.toFixed(2) + " m²";

    document.getElementById("eredmeny").innerHTML =
        osszeg.toFixed(2) + " RON";
}
</script>

</body>
</html>
