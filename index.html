
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Illkashmir ÁrKalkulátor</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f5f6;
    margin: 0;
    padding: 20px;
    color: #062f55;
}

.box {
    max-width: 430px;
    margin: auto;
    background: white;
    padding: 24px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.14);
    border-top: 6px solid #8fbe00;
}

.logo {
    display: block;
    width: 100%;
    max-width: 330px;
    height: auto;
    margin: 0 auto 10px auto;
}

h2 {
    text-align: center;
    font-size: 21px;
    margin: 5px 0 25px;
    color: #062f55;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
    color: #062f55;
}

input, select, button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    font-size: 17px;
    box-sizing: border-box;
    border-radius: 10px;
}

input, select {
    border: 1px solid #b9c3ca;
    background: white;
}

input:focus, select:focus {
    outline: 2px solid #8fbe00;
    border-color: #8fbe00;
}

button {
    margin-top: 24px;
    background: #8fbe00;
    color: #062f55;
    border: none;
    font-weight: bold;
    font-size: 18px;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

#meretEredmeny {
    text-align: center;
    margin-top: 20px;
    font-size: 18px;
    color: #062f55;
}

#eredmeny {
    margin-top: 15px;
    padding: 18px;
    background: #f1f8df;
    border: 2px solid #8fbe00;
    border-radius: 12px;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #062f55;
}

.info {
    text-align: center;
    font-size: 13px;
    color: #6b747b;
    margin-top: 22px;
}
</style>
</head>

<body>

<div class="box">

<img
src="file_00000000863881f4b494679524093f2e.png"
alt="Illkashmir"
class="logo">

<h2>Szőnyegtisztítás árkalkulátor</h2>

<label>Hosszúság (méter)</label>
<input type="number" id="hossz" step="0.01" placeholder="pl. 3">

<label>Szélesség (méter)</label>
<input type="number" id="szelesseg" step="0.01" placeholder="pl. 2.5">

<label>Szolgáltatás</label>
<select id="szolgaltatas">
    <option value="18">Behozva az üzembe – 18 RON/m²</option>
    <option value="20">Mi megyünk érte – 20 RON/m²</option>
</select>

<button onclick="szamol()">Ár kiszámítása</button>

<div id="meretEredmeny"></div>
<div id="eredmeny"></div>

<div class="info">
Az ár tájékoztató jellegű.
</div>

</div>

<script>
function szamol() {
    const hossz = parseFloat(document.getElementById("hossz").value);
    const szelesseg = parseFloat(document.getElementById("szelesseg").value);
    const ar = parseFloat(document.getElementById("szolgaltatas").value);

    if (!hossz || !szelesseg || hossz <= 0 || szelesseg <= 0) {
        document.getElementById("meretEredmeny").innerHTML =
        "Add meg a szőnyeg hosszát és szélességét!";
        document.getElementById("eredmeny").innerHTML = "";
        return;
    }

    const nm = hossz * szelesseg;
    const osszeg = nm * ar;

    document.getElementById("meretEredmeny").innerHTML =
        "Méret: <strong>" + nm.toFixed(2) + " m²</strong>";

    document.getElementById("eredmeny").innerHTML =
        osszeg.toFixed(2) + " RON";
}
</script>

</body>
</html>
